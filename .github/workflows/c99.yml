name: c99

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.cc || 'default' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest }
          - { os: windows-latest }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure
        run: cmake -S c99 -B build ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0}', matrix.cc) || '' }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Install
        run: cmake --install build --config Debug --prefix "${{ github.workspace }}/install"
      - name: Test the installed package
        run: |
          cmake -S c99/tests/package -B build-package -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0}', matrix.cc) || '' }}
          cmake --build build-package --config Debug
          ctest --test-dir build-package -C Debug --output-on-failure

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Configure
        run: cmake -S c99 -B build -DBUILD_TESTING=OFF
      - name: Build the documentation
        run: cmake --build build --target docs
      - name: Lay out the site
        run: mkdir site && cp -R build/html site/c99
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}c99/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
