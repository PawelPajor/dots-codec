version = 1

# Files that cannot carry an SPDX header of their own.
[[annotations]]
path = [
  "CLAUDE.md",
  ".claude/settings.json",
  ".gitmodules",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pawel Pajor"
